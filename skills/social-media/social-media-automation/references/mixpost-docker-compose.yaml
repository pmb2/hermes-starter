# mixpost-docker-compose.yaml
# Minimal self-hosted Mixpost (inovector/mixpost) stack.
# Run alongside Postiz on a different port.

version: "3.8"

services:
  mixpost:
    image: inovector/mixpost:latest
    container_name: mixpost
    ports:
      - "4008:80"
    environment:
      APP_URL: "http://localhost:4008"
      APP_KEY: "base64:change-me-to-a-32-char-random-key"
      DB_CONNECTION: mysql
      DB_HOST: mixpost-mysql
      DB_PORT: 3306
      DB_DATABASE: mixpost
      DB_USERNAME: mixpost
      DB_PASSWORD: changeme
      REDIS_HOST: mixpost-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: null
    depends_on:
      - mixpost-mysql
      - mixpost-redis
    volumes:
      - mixpost-storage:/var/www/html/storage

  mixpost-mysql:
    image: mysql:8.0
    container_name: mixpost-mysql
    environment:
      MYSQL_DATABASE: mixpost
      MYSQL_USER: mixpost
      MYSQL_PASSWORD: changeme
      MYSQL_ROOT_PASSWORD: changeme-root
    volumes:
      - mixpost-mysql:/var/lib/mysql

  mixpost-redis:
    image: redis:7-alpine
    container_name: mixpost-redis

volumes:
  mixpost-storage:
  mixpost-mysql:
