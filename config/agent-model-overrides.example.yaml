# Agent Model Override Manifest
#
# Agents listed here get a different model than the default uniform config.
# Agents NOT listed here get the default agent-workhorse-combo.
#
# Add overrides by uncommenting and editing. Format:
#   <agent-slug>:
#     default: <model-id>       # model ID as known to OmniRoute
#     provider: custom:omniroute # always omniroute
#
# See docs/plans/buzz-migration-architecture-v2.md for the full routing design.

# === DEFAULT (applied to all agents not listed below) ===
# combo: agent-workhorse-combo
# chain: oc/deepseek-v4-flash-free → opencode-go/deepseek-v4-flash → yunwu/deepseek-v4-flash → openrouter/gemma

